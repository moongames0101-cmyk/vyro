services:
  - type: web
    name: vyro-chat
    runtime: node
    plan: free
    buildCommand: "echo VYRO ready"
    startCommand: "node server/index.js"
    envVars:
      - key: PORT
        value: 3847
      # Your VYRO username(s) that can review reports and ban people from Live
      - key: VYRO_ADMINS
        sync: false
      # Face age scan before going live: estimate needed to pass (default 18). Set VYRO_FACE_CHECK to off to disable.
      - key: VYRO_FACE_MIN_AGE
        value: 18
      # VYRO+ card payments (Stripe) - leave empty until you are ready
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VYRO_PUBLIC_URL
        sync: false
      # VYRO+ Google Play billing - leave empty until the app is on Google Play
      - key: VYRO_GOOGLE_SERVICE_ACCOUNT
        sync: false
      - key: VYRO_RTDN_SECRET
        sync: false
    disk:
      name: vyro-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
