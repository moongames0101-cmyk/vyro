services:
  - type: web
    name: vyro-chat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3847
      # Keeps people signed in when the server restarts. Render makes this up for you.
      - key: VYRO_SECRET
        generateValue: true
      # Backblaze B2 backup. The free plan wipes the server's files on every restart,
      # so without these four, every account and message is lost. See README.
      - key: BACKUP_BUCKET
        sync: false
      - key: BACKUP_ENDPOINT
        sync: false
      - key: BACKUP_KEY_ID
        sync: false
      - key: BACKUP_APP_KEY
        sync: false
      # Your VYRO username(s) that can review reports and ban people from Live
      - key: VYRO_ADMINS
        sync: false
      # Face age scan before going live: estimate needed to pass (default 18). Set VYRO_FACE_CHECK to off to disable.
      - key: VYRO_FACE_MIN_AGE
        value: 18
      # VYRO+ payments: just the Stripe secret key. The server sets up the rest
      # in Stripe itself (see STORE-RELEASE.md). Leave empty until you're ready.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Lets the Android app from GitHub take card payments too. Set it to 0 for a
      # Google Play build: Play only allows its own billing for in-app purchases.
      - key: VYRO_STRIPE_IN_APK
        value: 1
      # VYRO+ Google Play billing - leave empty until the app is on Google Play
      - key: VYRO_GOOGLE_SERVICE_ACCOUNT
        sync: false
      - key: VYRO_RTDN_SECRET
        sync: false
