name: Build and Release VYRO

# Releases happen two ways:
#  - push a tag like v1.2.0, or
#  - merge into main with a NEW version number in package.json (the tag is made for you).
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Work out the version and whether it needs releasing
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in
            v1.0.[0-6]) echo "Old version $tag was released by hand, skipping"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [[ "$GITHUB_REF" != refs/tags/* ]] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    # One release run per version at a time, so two runs can never make duplicate releases
    concurrency:
      group: release-${{ needs.check-version.outputs.tag }}
      cancel-in-progress: false
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run API & WebSocket tests
        run: npm test

      - name: Sync GitHub repository metadata for auto-updater
        shell: pwsh
        run: |
          $owner, $repo = "${{ github.repository }}".Split('/')
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.build.publish[0].owner = $owner
          $pkg.build.publish[0].repo = $repo
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -Encoding UTF8

          $cfg = Get-Content vyro.config.json -Raw | ConvertFrom-Json
          $cfg.githubOwner = $owner
          $cfg.githubRepo = $repo
          $cfg.version = $pkg.version
          $cfg | ConvertTo-Json -Depth 5 | Set-Content vyro.config.json -Encoding UTF8

      - name: Build Windows Installer & Portable EXE
        run: npx electron-builder --win nsis portable --x64 --publish never

      # Upload everything to ONE release. (Letting electron-builder publish both builds at once
      # made two releases with the same tag, which broke desktop auto-updates.)
      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          test -f dist/latest.yml || { echo "dist/latest.yml is missing, so auto-update would break"; exit 1; }
          files=(dist/*.exe dist/*.exe.blockmap dist/latest.yml)
          tag="${{ needs.check-version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "${tag#v}" --notes "VYRO ${tag#v}"
          fi
